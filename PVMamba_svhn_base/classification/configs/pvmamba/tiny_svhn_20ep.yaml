BASE: ['base.yaml']

MODEL:
  TYPE: pvmamba
  NAME: tiny_svhn_20ep
  DROP_PATH_RATE: 0.1
  PRETRAINED: ''
  RESUME: ''
  NUM_CLASSES: 10
  LABEL_SMOOTHING: 0.0
  PVMAMBA:
    IMAGE_SIZE: 32
    EMBED_DIM: 64
    DEPTHS: [2, 4, 8, 4]
    NUM_HEADS: [2, 4, 8, 16]
    SSD_EXPANSION: 2
    SSD_CHUNK_SIZE: 256
    TOKEN_MIXER_TYPES: ['LoDSA', 'LoDSA', 'SaDSA', 'attention']
    SPATIAL_FLAG: [[], [], [0, 2, 2, 1, 2, 2, 1, 2], [0, 2, 2, 1]]
  DDP: 'torch'

DATA:
  DATASET: 'svhn'
  DATA_PATH: '/home/jlx_75/datasets/svhn'
  IMG_SIZE: 32
  BATCH_SIZE: 128
  NUM_WORKERS: 8
  PIN_MEMORY: True

AUG:
  AUTO_AUGMENT: 'none'
  COLOR_JITTER: 0.0
  CUTMIX: 0.0
  MIXUP: 0.0
  REPROB: 0.0

TRAIN:
  EPOCHS: 20
  WARMUP_EPOCHS: 1
  AUTO_RESUME: False
  BASE_LR: 0.00025
  MIN_LR: 2.5e-6
  WEIGHT_DECAY: 0.05
  MESA: 1.0