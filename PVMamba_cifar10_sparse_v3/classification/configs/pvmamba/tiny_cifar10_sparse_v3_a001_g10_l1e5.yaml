BASE: ['base.yaml']

MODEL:
  TYPE: pvmamba
  NAME: tiny_cifar10_30ep_sparse
  DROP_PATH_RATE: 0.2
  PRETRAINED: ''
  RESUME: ''
  NUM_CLASSES: 10
  PVMAMBA:
    EMBED_DIM: 64
    DEPTHS: [2, 4, 8, 4]
    NUM_HEADS: [2, 4, 8, 16]
    SSD_EXPANSION: 2
    SSD_CHUNK_SIZE: 256
    TOKEN_MIXER_TYPES: ['LoDSA', 'LoDSA', 'SaDSA', 'attention']
    SPATIAL_FLAG: [[], [], [0, 2, 2, 1, 2, 2, 1, 2], [0, 2, 2, 1]]

    # ===== 新增 sparse 配置 =====
    SPARSE_LAYERS: [2, 3]
    SPARSE_HIDDEN_RATIO: 0.25
    SPARSE_THRESHOLD: 0.0
    HARD_SPARSE: False
    SPARSE_ALPHA: 0.01
    SPARSE_GAMMA: 1.0

  DDP: 'torch'

DATA:
  DATASET: 'cifar10'
  DATA_PATH: '/home/jlx_75/datasets/cifar10'
  IMG_SIZE: 32
  BATCH_SIZE: 128

TRAIN:
  EPOCHS: 30
  WARMUP_EPOCHS: 1
  AUTO_RESUME: False
  MESA: 1.0

  # ===== 新增 sparse loss 系数 =====
  LAMBDA_SPARSE: 1e-5